<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrackForMinecraftNefq</title>
<style>
  :root{
    --bg:#0b0b10; --accent:#00e5ff; --accent2:#a855f7;
    --text:#e8e8f0; --muted:#8a8aa0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 70% -10%,rgba(168,85,247,.18),transparent),
               radial-gradient(900px 500px at 0% 10%,rgba(0,229,255,.12),transparent),
               var(--bg);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{text-align:center;max-width:640px;padding:48px 32px;
    background:rgba(20,20,30,.55);border:1px solid rgba(255,255,255,.08);
    border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .logo{font-size:46px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tag{color:var(--muted);margin-top:14px;font-size:17px;line-height:1.5}
  footer{text-align:center;color:var(--muted);margin-top:32px;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CrackForMinecraftNefq</div>
    <div class="tag">Читы для Minecraft.<br>Сообщество закрыто на техобслуживание.</div>
    <footer>© CrackForMinecraftNefq</footer>
  </div>
</body>
</html>
