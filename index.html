<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrackForMinecraftNefq</title>
<style>
  :root{
    --bg:#0b0b10; --panel:rgba(20,20,30,.55); --accent:#00e5ff; --accent2:#a855f7;
    --text:#e8e8f0; --muted:#8a8aa0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 70% -10%,rgba(168,85,247,.18),transparent),
               radial-gradient(900px 500px at 0% 10%,rgba(0,229,255,.12),transparent),
               var(--bg);
    min-height:100vh;padding:40px 20px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{text-align:center;margin-bottom:40px}
  .logo{font-size:42px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tag{color:var(--muted);margin-top:10px;font-size:16px}
  .panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);
    border-radius:18px;padding:24px;backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .section-title{font-size:22px;font-weight:700;margin-bottom:16px;
    display:flex;align-items:center;gap:10px}
  .search{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);color:var(--text);font-size:15px;margin-bottom:20px;outline:none}
  .search:focus{border-color:var(--accent)}
  .users{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .ucard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:14px;text-align:center;transition:.2s}
  .ucard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .ava{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 10px;
    border:2px solid var(--accent2);background:#222;display:flex;align-items:center;justify-content:center;font-size:26px;color:#888}
  .uname{font-weight:600;font-size:15px;word-break:break-word}
  .empty{color:var(--muted);text-align:center;padding:30px;grid-column:1/-1}
  .loading{color:var(--muted);text-align:center;padding:20px;grid-column:1/-1}
  footer{text-align:center;color:var(--muted);margin-top:40px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">CrackForMinecraftNefq</div>
    <div class="tag">Читы для Minecraft · сообщество игроков</div>
  </header>

  <section class="panel">
    <div class="section-title">👥 Участники</div>
    <input id="userSearch" class="search" placeholder="Поиск по нику...">
    <div id="userList" class="users"><div class="loading">Загрузка...</div></div>
  </section>

  <footer>© CrackForMinecraftNefq</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAs0gO57MKXaPqUZS-8eid3T6HBuguXpRs",
    authDomain: "crackforminecraftnefq.firebaseapp.com",
    projectId: "crackforminecraftnefq",
    storageBucket: "crackforminecraftnefq.firebasestorage.app",
    messagingSenderId: "120114665854",
    appId: "1:120114665854:web:7ab3060e44f21b052bf5c6"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const userList = document.getElementById('userList');
  const userSearch = document.getElementById('userSearch');
  let allUsers = [];

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderUsers(list){
    if(!list.length){ userList.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
    userList.innerHTML = list.map(u => {
      const ava = u.avatar
        ? `<img class="ava" src="${escapeHtml(u.avatar)}" alt="">`
        : `<div class="ava">${(u.username||'?').charAt(0).toUpperCase()}</div>`;
      return `<div class="ucard">${ava}<div class="uname">${escapeHtml(u.username||'Без имени')}</div></div>`;
    }).join('');
  }

  async function loadUsers(){
    try{
      const snap = await db.collection('users').get();
      allUsers = snap.docs.map(d => d.data());
      renderUsers(allUsers);
    }catch(e){
      userList.innerHTML = '<div class="empty">Не удалось загрузить список</div>';
    }
  }

  userSearch.addEventListener('input', () => {
    const q = userSearch.value.trim().toLowerCase();
    renderUsers(allUsers.filter(u => (u.username||'').toLowerCase().includes(q)));
  });

  loadUsers();
</script>
</body>
</html>
