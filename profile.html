<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - MinecraftCheatsBYNefq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .profile-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-header h1 {
            font-size: 1.8em;
            color: #fff;
            font-weight: 700;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .back-btn:hover {
            color: #fff;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 3em;
            font-weight: 600;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .avatar:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-upload {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 0.9em;
        }

        .avatar-upload:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        #avatarInput {
            display: none;
        }

        .info-section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .role-owner {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .role-moderator {
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.4);
        }

        .role-user {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .role-пользователь {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-list-section {
            margin-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 18px;
        }

        .user-list-title {
            color: #fff;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .user-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .ul-name {
            color: #fff;
            font-size: 0.9em;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ul-date {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.72em;
        }

        .role-select {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.8em;
            cursor: pointer;
            outline: none;
        }

        .role-select option {
            background: #111;
            color: #fff;
        }

        .ban-btn {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid rgba(255, 80, 80, 0.5);
            color: #ff6b6b;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.78em;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ban-btn:hover {
            background: rgba(255, 80, 80, 0.4);
        }

        .ban-btn.banned {
            background: rgba(80, 200, 120, 0.2);
            border-color: rgba(80, 200, 120, 0.5);
            color: #4fd98a;
        }

        .ban-btn.banned:hover {
            background: rgba(80, 200, 120, 0.4);
        }

        .ul-banned {
            color: #ff6b6b;
            font-size: 0.75em;
            font-weight: 600;
        }

        .uid {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .actions-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.6, 1);
            text-align: center;
            text-decoration: none;
        }

        .save-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
        }

        .logout-btn {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid rgba(255, 80, 80, 0.5);
            color: #ff6b6b;
        }

        .logout-btn:hover {
            background: rgba(255, 80, 80, 0.4);
            border-color: #ff6b6b;
        }

        .delete-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.6, 1);
            text-align: center;
            background: rgba(255, 50, 50, 0.15);
            border: 1px solid rgba(255, 50, 50, 0.4);
            color: #ff5555;
        }

        .delete-btn:hover {
            background: rgba(255, 50, 50, 0.35);
            border-color: #ff5555;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(40, 40, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal h3 {
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .modal p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .modal-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-delete {
            background: rgba(255, 50, 50, 0.3);
            color: #ff5555;
            border: 1px solid rgba(255, 50, 50, 0.5);
        }

        .modal-delete:hover {
            background: rgba(255, 50, 50, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(80, 80, 80, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9em;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="profile-container">
        <div class="profile-header">
            <h1>Профиль</h1>
            <a href="index.html" class="back-btn">&lt; На главную</a>
        </div>

        <div class="avatar-section">
            <div class="avatar-wrapper">
                <div class="avatar" id="avatar"></div>
                <label class="avatar-upload" for="avatarInput">&#128247;</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>
            <span id="usernameDisplay" style="color: #fff; font-size: 1.2em; font-weight: 600;"></span>
        </div>

        <div class="info-section">
            <div class="info-row">
                <span class="info-label">Имя пользователя</span>
                <span class="info-value" id="usernameInfo"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Роль</span>
                <span class="role-badge" id="roleInfo"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата регистрации</span>
                <span class="info-value" id="regDate"></span>
            </div>
            <div class="info-row">
                <span class="info-label">Последний визит</span>
                <span class="info-value" id="lastVisit"></span>
            </div>
        </div>

        <div class="actions-section">
            <button class="action-btn save-btn" onclick="saveAvatar()">Сохранить</button>
            <button class="action-btn logout-btn" onclick="logout()">Выйти</button>
            <button class="delete-btn" onclick="showDeleteModal()">Удалить</button>
        </div>

        <div class="user-list-section" id="userListSection" style="display:none;">
            <h3 class="user-list-title">Список пользователей</h3>
            <div class="user-list" id="userList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>Удалить аккаунт?</h3>
            <p>Это действие нельзя отменить. Все данные будут удалены.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-cancel" onclick="hideDeleteModal()">Отмена</button>
                <button class="modal-btn modal-delete" onclick="deleteAccount()">Удалить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAs0gO57MKXaPqUZS-8eid3T6HBuguXpRs",
            authDomain: "crackforminecraftnefq.firebaseapp.com",
            projectId: "crackforminecraftnefq",
            storageBucket: "crackforminecraftnefq.firebasestorage.app",
            messagingSenderId: "203343669542",
            appId: "1:203343669542:web:2bb33fb9d7caa7f54579e7",
            measurementId: "G-BCYM03LE00"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        if (firebase.appCheck) {
            const appCheck = firebase.appCheck();
            appCheck.activate(
                new firebase.appCheck.RecaptchaV3Provider('6LeRvoUtAAAAAFBrlGD--VFXp4d4MIhQUKHDdwPe'),
                true
            );
        }

        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = 'd_' + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
                localStorage.setItem('deviceId', id);
                document.cookie = 'deviceId=' + id + '; path=/; max-age=31536000';
            }
            return id;
        }

        function userDocId(name) {
            return name.trim().toLowerCase();
        }

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                star.style.animationDelay = `${Math.random() * 4}s`;
                star.style.animationDuration = `${2 + Math.random() * 3}s`;

                starsContainer.appendChild(star);
            }
        }

        function generateUID() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let uid = 'UID-';
            for (let i = 0; i < 8; i++) {
                uid += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return uid;
        }

        let currentUsername = '';
        let currentUid = '';

        function saveUserData(data) {
            if (!currentUid) return;
            db.collection('users').doc(currentUid).update(data).catch(() => {});
        }

        function loadProfile() {
            if (!currentUid) {
                window.location.href = 'register.html';
                return;
            }

            db.collection('users').doc(currentUid).get().then((snap) => {
                if (!snap.exists) {
                    window.location.href = 'register.html';
                    return;
                }
                const u = snap.data();
                db.collection('users').doc(currentUid).update({
                    prevVisit: u.lastVisit || null,
                    lastVisit: new Date().toLocaleString('ru-RU')
                });
            });

            db.collection('users').doc(currentUid).onSnapshot((snap) => {
                if (!snap.exists) return;
                const user = snap.data();

                if (user.banned === true) {
                    firebase.auth().signOut().then(() => { window.location.href = 'register.html?banned=1'; });
                    return;
                }

                document.getElementById('usernameDisplay').textContent = user.username;
                document.getElementById('usernameInfo').textContent = user.username;

                const role = user.role || 'Пользователь';
                const roleEl = document.getElementById('roleInfo');
                roleEl.textContent = role;
                roleEl.className = 'role-badge role-' + role.toLowerCase();

                const avatar = document.getElementById('avatar');
                if (user.avatar) {
                    avatar.innerHTML = `<img src="${user.avatar}" alt="Avatar">`;
                } else {
                    avatar.textContent = user.username.charAt(0).toUpperCase();
                }

                document.getElementById('regDate').textContent = user.regDate || 'Неизвестно';
                document.getElementById('lastVisit').textContent = user.prevVisit || user.lastVisit || 'Сейчас';

                if (user.username.toLowerCase() === 'nefq' && !userListSubscribed) {
                    userListSubscribed = true;
                    subscribeUserList();
                }
            });
        }

        function initApp() {
            firebase.auth().onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'register.html';
                    return;
                }
                currentUid = user.uid;
                currentUsername = user.email.split('@')[0];
                localStorage.setItem('currentUser', currentUsername);
                localStorage.setItem('currentUid', currentUid);
                db.collection('userSecrets').doc(currentUid).set({ deviceId: getDeviceId() }, { merge: true }).catch(() => {});
                loadProfile();
            });
        }

        function escapeHtmlProfile(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let userListUnsub = null;
        let userListSubscribed = false;

        function subscribeUserList() {
            const section = document.getElementById('userListSection');
            const list = document.getElementById('userList');
            section.style.display = 'block';
            list.innerHTML = '';

            if (userListUnsub) userListUnsub();
            userListUnsub = db.collection('users').onSnapshot((snap) => {
                list.innerHTML = '';
                if (snap.empty) {
                    list.innerHTML = '<div class="ul-date">Пользователей пока нет</div>';
                    return;
                }
                snap.forEach((doc) => {
                    const u = doc.data();
                    const role = u.role || 'Пользователь';
                    const banned = u.banned === true;
                    const row = document.createElement('div');
                    row.className = 'user-list-row';

                    const isSelfNefq = u.username.toLowerCase() === 'nefq';
                    const roleControl = isSelfNefq
                        ? `<span class="role-badge role-${role.toLowerCase()}">${escapeHtmlProfile(role)}</span>`
                        : `<select class="role-select" onchange="changeUserRole('${doc.id}', this.value)">
                               <option value="Пользователь" ${role === 'Пользователь' ? 'selected' : ''}>Пользователь</option>
                               <option value="Модератор" ${role === 'Модератор' ? 'selected' : ''}>Модератор</option>
                           </select>`;

                    const banBtn = isSelfNefq
                        ? ''
                        : `<button class="ban-btn ${banned ? 'banned' : ''}" onclick="toggleProfileBan('${doc.id}', ${banned})">${banned ? 'Разбанить' : 'Забанить'}</button>`;

                    row.innerHTML = `
                        <span class="ul-name">${escapeHtmlProfile(u.username)}</span>
                        ${banned ? '<span class="ul-banned">[бан]</span>' : ''}
                        ${roleControl}
                        ${banBtn}
                        <span class="ul-date">${escapeHtmlProfile(u.regDate || '')}</span>
                    `;
                    list.appendChild(row);
                });
            });
        }

        function logAction(action, details) {
            db.collection('logs').add({
                by: currentUsername,
                action: action,
                details: details || '',
                time: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }

        function changeUserRole(docId, role) {
            db.collection('users').doc(docId).update({ role: role }).then(() => {
                logAction('change_role', 'docId: ' + docId + ' | role: ' + role);
                showToast('Роль изменена: ' + role);
            }).catch(() => {
                showToast('Ошибка смены роли');
            });
        }

        function banDevice(dev) {
            if (!dev) return;
            db.collection('bannedDevices').doc('global').set({ ['ids.' + dev]: true }, { merge: true }).catch(() => {});
        }

        function unbanDevice(dev) {
            if (!dev) return;
            db.collection('bannedDevices').doc('global').get().then((s) => {
                if (s.exists && s.data().ids && s.data().ids[dev]) {
                    db.collection('bannedDevices').doc('global').update({ ['ids.' + dev]: firebase.firestore.FieldValue.delete() }).catch(() => {});
                }
            });
        }

        function toggleProfileBan(docId, banned) {
            db.collection('users').doc(docId).update({ banned: !banned }).then(() => {
                if (!banned) {
                    db.collection('userSecrets').doc(docId).get().then((s) => {
                        const d = s.data();
                        if (d && d.deviceId) banDevice(d.deviceId);
                    }).catch(() => {});
                } else {
                    db.collection('userSecrets').doc(docId).get().then((s) => {
                        const d = s.data();
                        if (d && d.deviceId) unbanDevice(d.deviceId);
                    }).catch(() => {});
                }
                logAction(!banned ? 'ban_user' : 'unban_user', 'docId: ' + docId);
                showToast(banned ? 'Пользователь разбанен' : 'Пользователь забанен');
            }).catch(() => {
                showToast('Ошибка бана');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const avatar = document.getElementById('avatar');
                    avatar.innerHTML = `<img src="${event.target.result}" alt="Avatar">`;
                    localStorage.setItem('tempAvatar', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function saveAvatar() {
            const tempAvatar = localStorage.getItem('tempAvatar');
            if (tempAvatar) {
                saveUserData({ avatar: tempAvatar });
                localStorage.removeItem('tempAvatar');
                showToast('Аватар сохранён!');
            } else {
                showToast('Изменений нет');
            }
        }

        function logout() {
            if (firebase.auth().currentUser) {
                firebase.auth().signOut().catch(() => {});
            }
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentUid');
            localStorage.removeItem('tempAvatar');
            window.location.href = 'register.html';
        }

        function showDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }

        function hideDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }

        function deleteAccount() {
            if (currentUid) {
                db.collection('users').doc(currentUid).delete().catch(() => {});
            }
            if (firebase.auth().currentUser) {
                firebase.auth().currentUser.delete().catch(() => {});
            }
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentUid');
            localStorage.removeItem('tempAvatar');
            window.location.href = 'register.html';
        }

        createStars();
        initApp();
    </script>
</body>
</html>
