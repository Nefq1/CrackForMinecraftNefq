<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать аккаунт - MinecraftCheatsBYNefq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .register-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .register-header h1 {
            font-size: 2em;
            color: #fff;
            font-weight: 700;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .back-btn:hover {
            color: #fff;
        }

        .register-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #fff;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.6, 1);
            margin-top: 10px;
        }

        .register-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85em;
            margin-top: 8px;
            display: none;
        }

        .success-message {
            color: #51cf66;
            font-size: 0.85em;
            margin-top: 8px;
            display: none;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        .toggle-form a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .toggle-form a:hover {
            opacity: 0.8;
        }

        #loginForm {
            display: none;
        }

        @keyframes formFadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-animate {
            animation: formFadeIn 0.4s cubic-bezier(0.4, 0, 0.6, 1);
        }

        .register-footer {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .support-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.6, 1);
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        .support-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transform: translateY(-3px) scale(1.05);
        }

        .botcheck-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-question {
            color: #fff;
            font-size: 1em;
            white-space: nowrap;
        }

        .bot-answer {
            width: 90px;
            flex: 0 0 auto;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="register-container">
        <div class="register-header">
            <h1>Войти в чат</h1>
            <a href="index.html" class="back-btn">&lt; На главную</a>
        </div>
        <p class="register-subtitle">Придумайте имя и подтвердите, что вы не робот.</p>

        <form id="enterForm">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя (3-20 символов)" maxlength="20" required>
            </div>

            <div class="form-group">
                <label>Проверка на бота</label>
                <div class="botcheck-row">
                    <span id="botQuestion" class="bot-question"></span>
                    <input type="text" id="botAnswer" placeholder="?" class="bot-answer" required>
                </div>
            </div>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <button type="submit" class="register-btn">Войти в чат</button>
        </form>

        <div class="register-footer">
            <a href="https://t.me/Nefqqq" class="support-btn" target="_blank">Support</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAs0gO57MKXaPqUZS-8eid3T6HBuguXpRs",
            authDomain: "crackforminecraftnefq.firebaseapp.com",
            projectId: "crackforminecraftnefq",
            storageBucket: "crackforminecraftnefq.firebasestorage.app",
            messagingSenderId: "203343669542",
            appId: "1:203343669542:web:2bb33fb9d7caa7f54579e7",
            measurementId: "G-BCYM03LE00"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = 'd_' + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
                localStorage.setItem('deviceId', id);
                document.cookie = 'deviceId=' + id + '; path=/; max-age=31536000';
            }
            return id;
        }

        if (location.search.includes('banned=1')) {
            const b = document.getElementById('errorMsg');
            b.textContent = 'Ваш аккаунт заблокирован. Обратитесь к администратору.';
            b.style.display = 'block';
        }

        function userDocId(name) {
            return name.trim().toLowerCase();
        }

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;

                star.style.animationDelay = `${Math.random() * 4}s`;
                star.style.animationDuration = `${2 + Math.random() * 3}s`;

                starsContainer.appendChild(star);
            }
        }

        function getNextUID() {
            let lastUID = parseInt(localStorage.getItem('lastUID') || '0');
            lastUID++;
            localStorage.setItem('lastUID', lastUID.toString());
            return lastUID;
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let botA = 0, botB = 0;
        function newBotQuestion() {
            botA = Math.floor(Math.random() * 9) + 1;
            botB = Math.floor(Math.random() * 9) + 1;
            const q = document.getElementById('botQuestion');
            if (q) q.textContent = `Сколько будет ${botA} + ${botB}?`;
        }
        newBotQuestion();

        document.getElementById('enterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const botVal = parseInt(document.getElementById('botAnswer').value.trim(), 10);
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (username.length < 3) {
                errorMsg.textContent = 'Имя пользователя должно быть не менее 3 символов';
                errorMsg.style.display = 'block';
                return;
            }

            if (username.length > 20) {
                errorMsg.textContent = 'Имя пользователя не должно превышать 20 символов';
                errorMsg.style.display = 'block';
                return;
            }

            if (isNaN(botVal) || botVal !== botA + botB) {
                errorMsg.textContent = 'Неверный ответ. Вы робот?';
                errorMsg.style.display = 'block';
                newBotQuestion();
                document.getElementById('botAnswer').value = '';
                return;
            }

            try {
                await firebase.auth().signOut().catch(() => {});
                const cred = await firebase.auth().signInAnonymously();
                const uid = cred.user.uid;
                await cred.user.getIdToken(true);

                const userDoc = {
                    username: username,
                    uid: uid,
                    role: 'Пользователь',
                    regDate: new Date().toLocaleDateString('ru-RU'),
                    lastVisit: new Date().toLocaleString('ru-RU'),
                    prevVisit: null,
                    avatar: null
                };

                let written = false;
                let lastErr = null;
                for (let attempt = 0; attempt < 4 && !written; attempt++) {
                    try {
                        await db.collection('users').doc(uid).set(userDoc);
                        written = true;
                    } catch (e) {
                        lastErr = e;
                        await cred.user.getIdToken(true);
                        await new Promise(r => setTimeout(r, 700));
                    }
                }
                if (!written) throw lastErr;

                await db.collection('userSecrets').doc(uid).set({ deviceId: getDeviceId() }, { merge: true }).catch(() => {});

                localStorage.setItem('currentUser', username);
                localStorage.setItem('currentUid', uid);

                successMsg.textContent = 'Вход выполнен!';
                successMsg.style.display = 'block';
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } catch (err) {
                errorMsg.textContent = 'Ошибка: ' + (err.message || err.code);
                errorMsg.style.display = 'block';
            }
        });

        createStars();
    </script>
</body>
</html>
